title: Tweed
author: Laurence Vincent
version: 1.0.0
quarto-required: ">=1.6.0"
contributes:
  formats:
    html:
      theme: [flatly, brand, tweed.scss]
      toc: true
      toc-depth: 4
      number-sections: true
      grid:
        body-width: 720px
      reference-location: margin
      citation-location: margin
      fig-cap-location: top
      code-fold: true
      fontsize: 14pt
      csl: apa.csl
      include-after-body:
        - caption-labels.html
        - list-of-floats.html
      execute:
        echo: false
        warning: false
        message: false
